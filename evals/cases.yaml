# Known tasks against MaikonJm/agent-sandbox-shop. Each has an acceptance
# test the agent never sees; it runs on the PR branch after the agent finishes.
- id: cart-total-quantity
  title: "[eval] Cart total ignores the quantity of the last item"
  body: |
    GET /cart/{cart_id} returns the wrong total when the last item has quantity > 1.
    Adding product 1 x2 and product 3 x2 must total 49.80. Remove the xfail marker once fixed.
  acceptance_test:
    path: tests/test_eval_cart_total.py
    content: |
      from decimal import Decimal
      from fastapi.testclient import TestClient
      from shop.main import app

      def test_eval_total_counts_every_quantity():
          c = TestClient(app)
          c.post("/cart/e1/items", json={"product_id": 2, "quantity": 1})
          c.post("/cart/e1/items", json={"product_id": 1, "quantity": 3})
          assert Decimal(c.get("/cart/e1").json()["total"]) == Decimal("149.60")

- id: search-tests
  title: "[eval] Add tests for product search by name"
  body: |
    GET /products?q=<text> filters by name, case-insensitive, and has no tests.
    Add tests for: q=shirt, q=SHIRT, q=zzz (empty) and no q (all products). Do not change behavior.
  acceptance_test:
    path: tests/test_eval_search.py
    content: |
      import pathlib

      def test_eval_search_tests_exist_and_cover_cases():
          text = "".join(p.read_text() for p in pathlib.Path("tests").glob("test_*.py")
                         if not p.name.startswith("test_eval"))
          assert "q=" in text or "params" in text
          assert "zzz" in text.lower() or "empty" in text.lower()

- id: delete-cart-item
  title: "[eval] Add DELETE /cart/{cart_id}/items/{product_id}"
  body: |
    Remove every line of a product from a cart: 204 on success, 404 when the cart or the product
    in the cart does not exist. GET /cart reflects the new total. Add tests.
  acceptance_test:
    path: tests/test_eval_delete.py
    content: |
      from fastapi.testclient import TestClient
      from shop.main import app

      def test_eval_delete_item():
          c = TestClient(app)
          c.post("/cart/e3/items", json={"product_id": 1, "quantity": 1})
          c.post("/cart/e3/items", json={"product_id": 3, "quantity": 1})
          assert c.delete("/cart/e3/items/1").status_code == 204
          assert c.get("/cart/e3").json()["total"] in ("5.00", "5")
          assert c.delete("/cart/e3/items/1").status_code == 404
          assert c.delete("/cart/nope/items/1").status_code == 404

- id: quantity-validation
  title: "[eval] Reject quantities above 99 when adding to the cart"
  body: |
    POST /cart/{cart_id}/items accepts any positive quantity. Limit it to 1..99 and return 422 above 99.
    Add a test.
  acceptance_test:
    path: tests/test_eval_quantity.py
    content: |
      from fastapi.testclient import TestClient
      from shop.main import app

      def test_eval_quantity_limit():
          c = TestClient(app)
          assert c.post("/cart/e4/items", json={"product_id": 1, "quantity": 100}).status_code == 422
          assert c.post("/cart/e4/items", json={"product_id": 1, "quantity": 99}).status_code == 201

- id: refactor-cart-store
  title: "[eval] Move cart storage behind a CartRepository class"
  body: |
    shop/cart.py uses a module-level CARTS dict. Introduce a CartRepository with add_item(cart_id, item),
    get(cart_id) and remove_product(cart_id, product_id) and use it from shop/main.py. Behavior and
    existing tests must not change; add unit tests for the repository.
  acceptance_test:
    path: tests/test_eval_repository.py
    content: |
      import inspect
      import shop.cart

      def test_eval_repository_exists():
          assert inspect.isclass(getattr(shop.cart, "CartRepository", None))
